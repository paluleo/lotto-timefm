name: Weekly Lotto Statistics Update

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'requirements-timesfm.txt'
      - '.github/workflows/weekly_predict.yml'
  schedule:
    # Saturday 21:10 KST, after the scheduled draw.
    - cron: "10 12 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-lotto-update
  cancel-in-progress: false

jobs:
  update-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-timesfm.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate source and behavior
        run: |
          test -f scripts/fetch_and_predict.py
          if git ls-files --stage | grep -q '^160000 '; then
            echo 'Unexpected gitlink in source tree' >&2
            exit 1
          fi
          python -m unittest discover -s tests -p 'test_*.py' -v
          node --test tests/*.test.js
      - name: Fetch official draws and update statistics
        id: collect
        timeout-minutes: 5
        continue-on-error: true
        run: |
          python scripts/fetch_and_predict.py
          python scripts/collect_history.py
      - name: Mark model output incomplete until real inference succeeds
        id: model_status
        run: python scripts/publish_timesfm_report.py --fail-reason "The current official-data and TimesFM run has not completed."
      - name: Cache the pinned public model
        timeout-minutes: 2
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/timesfm-model-cache
          key: timesfm-2p5-1d952420fba87f3c6dee4f240de0f1a0fbc790e3
      - name: Install the pinned CPU inference runtime
        id: runtime
        timeout-minutes: 10
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        run: |
          python -m pip install torch==2.15.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-timesfm.txt
      - name: Run actual TimesFM and chronological number-combination validation
        id: model
        timeout-minutes: 20
        if: steps.collect.outcome == 'success' && steps.runtime.outcome == 'success'
        continue-on-error: true
        run: |
          python scripts/timesfm_forecast.py --input public/data/draw-history.json --output "$RUNNER_TEMP/timesfm-full.json" --context 64 --holdout 104 --threads 2 --batch-size 4 --cache-dir "$RUNNER_TEMP/timesfm-model-cache"
          python scripts/publish_timesfm_report.py --input "$RUNNER_TEMP/timesfm-full.json"
      - name: Preserve the complete model audit report
        timeout-minutes: 2
        if: always() && (steps.model.outcome == 'success' || steps.model.outcome == 'failure')
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: timesfm-number-audit
          path: ${{ runner.temp }}/timesfm-full.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Save data or explicit failure status
        if: "!cancelled() && steps.model_status.outcome == 'success' && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure')"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for file in public/data/forecast.json public/data/draw-history.json public/data/timesfm.json; do
            if test -f "$file"; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "chore: update official lotto data and actual TimesFM status"
            git push origin HEAD:main
          fi
      - name: Report collection or model failure
        if: "!cancelled() && (steps.collect.outcome == 'failure' || steps.runtime.outcome == 'failure' || steps.model.outcome == 'failure')"
        run: |
          echo 'Official collection or actual TimesFM did not complete. No substitute model output was generated. See the status-save step for the publication outcome.' >&2
          exit 1
