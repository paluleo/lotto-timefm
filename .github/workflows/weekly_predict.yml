name: Weekly Lotto TimesFM Forecast Update

on:
  schedule:
    # 매주 토요일 12:10 UTC (한국시간 토요일 밤 21:10) 자동 실행
    - cron: "10 12 * * 6"
  workflow_dispatch: # GitHub Actions 탭에서 언제든 수동 1클릭 실행 가능

permissions:
  contents: write

jobs:
  update-forecast:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 시계열 예측 스크립트 실행 (forecast.json 갱신)
        run: python scripts/fetch_and_predict.py

      - name: 변경된 예측 데이터 자동 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/forecast.json
          git diff --staged --quiet || git commit -m "chore: update weekly lotto forecast data"
          git push